[project]
name = "the-dilemma-experiment"
version = "1.1.0"
description = "An open-source simulation exploring how cooperation emerges, survives, and collapses among self-interested agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dipen Shah", email = "synthex.labs.hq@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
the-dilemma = "the_dilemma_experiment.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
