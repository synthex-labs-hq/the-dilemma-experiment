[project]
name = "the-dilemma-experiment"
version = "0.1.0"
description = "An open-source simulation exploring how cooperation emerges, survives, and collapses among self-interested agents."
readme = "README.md"
authors = [
    { name = "Dipen Shah", email = "synthex.labs.hq@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
